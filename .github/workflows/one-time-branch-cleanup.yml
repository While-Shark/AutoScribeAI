name: One-time branch cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every remote branch except master
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin \
            | awk '{print $2}' \
            | sed 's#^refs/heads/##' \
            | while IFS= read -r branch; do
                if [ "$branch" = "master" ]; then
                  continue
                fi
                echo "Deleting remote branch: $branch"
                git push origin --delete "$branch"
              done

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-branch-cleanup.yml
          git add -u
          git commit -m "chore: remove one-time branch cleanup workflow"
          git push origin HEAD:master
